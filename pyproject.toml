[project]
name = "rag-playground-api"
version = "0.1.0"
description = "A configurable, fully traced RAG pipeline API (LangChain + LlamaIndex + Ollama)"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-community>=0.3",
    "langchain-core>=1.0",
    "langchain-ollama>=0.3.4",
    "langchain-text-splitters>=0.3",
    "llama-index-core>=0.12",
    "llama-index-readers-file>=0.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=5",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
